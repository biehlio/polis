# Polis Minimal Configuration for Coolify Deployment
# This docker-compose file contains ONLY the essential services needed to run Polis
# No local development services, no emulators, no optional components
#
# Required services:
# - PostgreSQL (database)
# - Server (Node.js API backend)
# - Math (Clojure math engine)
# - Nginx Proxy (reverse proxy)
# - File Server (static assets)
#
# Configuration assumes:
# - External AI keys will be provided (OpenAI, Anthropic, Gemini, etc.)
# - Email service configured externally (AWS SES, Mailgun, etc.)
# - All required environment variables set via Coolify's environment management

services:
  # PostgreSQL Database - ESSENTIAL
  postgres:
    restart: always
    build:
      context: ./server
      dockerfile: Dockerfile-db
    image: polis-postgres:latest
    container_name: polis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    networks:
      - polis-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js API Server - ESSENTIAL
  server:
    restart: unless-stopped
    build:
      context: ./server
      dockerfile: Dockerfile
      target: prod
    image: polis-server:latest
    container_name: polis-server
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      
      # Server Configuration
      NODE_ENV: production
      API_SERVER_PORT: ${API_SERVER_PORT:-5000}
      DEV_MODE: ${DEV_MODE:-false}
      
      # Logging
      SERVER_LOG_LEVEL: ${SERVER_LOG_LEVEL:-warn}
      
      # Auth/JWT
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE}
      JWKS_URI: ${JWKS_URI}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      POLIS_JWT_ISSUER: ${POLIS_JWT_ISSUER:-https://pol.is/}
      POLIS_JWT_AUDIENCE: ${POLIS_JWT_AUDIENCE:-participants}
      
      # URLs/Hostnames
      API_PROD_HOSTNAME: ${API_PROD_HOSTNAME}
      DOMAIN_OVERRIDE: ${DOMAIN_OVERRIDE}
      DOMAIN_WHITELIST_ITEM_01: ${DOMAIN_WHITELIST_ITEM_01}
      EMBED_SERVICE_HOSTNAME: ${EMBED_SERVICE_HOSTNAME}
      STATIC_FILES_HOST: ${STATIC_FILES_HOST:-file-server}
      
      # Email
      POLIS_FROM_ADDRESS: ${POLIS_FROM_ADDRESS}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-[]}
      
      # Third-party API keys (optional, user-provided)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AKISMET_ANTISPAM_API_KEY: ${AKISMET_ANTISPAM_API_KEY:-}
      GA_TRACKING_ID: ${GA_TRACKING_ID:-}
      
      # Admin configuration
      ADMIN_UIDS: ${ADMIN_UIDS:-}
      
      # Math service
      CACHE_MATH_RESULTS: ${CACHE_MATH_RESULTS:-true}
    
    networks:
      - polis-net
    
    depends_on:
      postgres:
        condition: service_healthy
      math:
        condition: service_started
    
    volumes:
      - server-logs:/app/logs
    
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Clojure Math Engine - ESSENTIAL
  math:
    restart: unless-stopped
    build:
      context: ./math
    image: polis-math:latest
    container_name: polis-math
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOGGING_LEVEL: ${MATH_LOG_LEVEL:-warn}
      MATH_ENV: ${MATH_ENV:-prod}
      WEBSERVER_USERNAME: ${WEBSERVER_USERNAME:-}
      WEBSERVER_PASS: ${WEBSERVER_PASS:-}
      DATABASE_POOL_SIZE: ${MATH_DATABASE_POOL_SIZE:-10}
    networks:
      - polis-net
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Static Files Server - ESSENTIAL
  file-server:
    restart: unless-stopped
    build:
      context: ./
      dockerfile: file-server/Dockerfile
      args:
        ADMIN_UIDS: ${ADMIN_UIDS}
        AUTH_AUDIENCE: ${AUTH_AUDIENCE}
        AUTH_CLIENT_ID: ${AUTH_CLIENT_ID}
        AUTH_ISSUER: ${AUTH_ISSUER}
        AUTH_NAMESPACE: ${AUTH_NAMESPACE:-}
        DD_APPLICATION_ID: ${DD_APPLICATION_ID:-}
        DD_CLIENT_TOKEN: ${DD_CLIENT_TOKEN:-}
        DD_SITE: ${DD_SITE:-}
        EMBED_SERVICE_HOSTNAME: ${EMBED_SERVICE_HOSTNAME}
        GA_TRACKING_ID: ${GA_TRACKING_ID:-}
        GIT_HASH: ${GIT_HASH:-placeholder}
        NODE_ENV: production
        OIDC_CACHE_KEY_ID_TOKEN_SUFFIX: ${OIDC_CACHE_KEY_ID_TOKEN_SUFFIX}
        OIDC_CACHE_KEY_PREFIX: ${OIDC_CACHE_KEY_PREFIX}
    image: polis-file-server:latest
    container_name: polis-file-server
    environment:
      PORT: ${STATIC_FILES_PORT:-8080}
    networks:
      - polis-net

  # Nginx Reverse Proxy - ESSENTIAL
  nginx-proxy:
    build:
      context: ./file-server
      dockerfile: nginx.Dockerfile
    image: polis-nginx-proxy:latest
    container_name: polis-nginx-proxy
    environment:
      API_SERVER_PORT: ${API_SERVER_PORT:-5000}
    networks:
      - polis-net
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - server
      - file-server
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/home"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  polis-net:
    driver: bridge

volumes:
  postgres_data:
  server-logs:
